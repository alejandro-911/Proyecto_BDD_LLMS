<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Club</title>
</head>
<body>
    <h1>Registro de Club</h1>

    <form id="form-registro-club">
        <label for="nombre_club">Nombre del club</label>
        <input type="text" id="nombre_club" required>

        <label for="ciudad">Ciudad</label>
        <input type="text" id="ciudad" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" required>

        <button type="submit">Registrar club</button>

    </form>

    <p id="mensaje-error"></p>
    <script type="module" src="/src/registro-club.js"></script>
</body>
</html>
