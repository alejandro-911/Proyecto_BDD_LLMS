<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Club</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Panel de gestión</h1>
        <button id="btn-logout">Cerrar sesión</button>
    </header>

    <!-- Sección: reservas actuales -->
    <h2>Reservas de tus pistas</h2>
    <div id="lista-reservas"></div>

    <!-- Sección: reserva manual (llamada telefónica) -->
    <h2>Añadir reserva manual</h2>
    <form id="form-reserva-manual">
        <label for="pista">Pista</label>
        <select id="pista" required></select>

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <label for="hora">Hora</label>
        <input type="time" id="hora" required>

        <button type="submit">Reservar</button>
    </form>
    <p id="mensaje-error"></p>

    <script type="module" src="/src/panel-club.js"></script>
</body>
</html>
